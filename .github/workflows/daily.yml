name: フィジカルAI 収集とサイト公開

# 記事を書くのは Claude の Routine（ROUTINE.md）。このワークフローは次の2つだけを担当する:
#   - 毎朝のニュース収集（RSS）→ data/raw/<日付>.json をコミット
#   - Routine が記事を push したら、サイトを作り直して GitHub Pages に公開

on:
  schedule:
    # 毎日 6:47（日本時間）に収集。Routine はその後 7:40 に記事を書く
    - cron: "47 21 * * *"
  workflow_dispatch:
  push:
    paths: ["content/**", "config/**", "app/**", "pipeline/build.js"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-physical-ai
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ニュースを収集
        if: github.event_name != 'push'
        run: npm run collect

      - name: 収集データをコミット
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "ニュース収集 $(TZ=Asia/Tokyo date +%F)"
            git push
          fi

      - name: サイトを生成
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
