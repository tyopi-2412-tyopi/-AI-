name: フィジカルAI 日次ノート

on:
  schedule:
    # 毎日 6:47（日本時間）に実行。正時はGitHub Actionsが混み合うため少しずらしている
    - cron: "47 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/**", "config/**", "app/**", "pipeline/build.js"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-physical-ai
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ニュースを収集
        if: github.event_name != 'push'
        run: npm run collect

      - name: Claude で記事化
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run write

      - name: 収集データと記事をコミット
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data content
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "日次ノート $(TZ=Asia/Tokyo date +%F)"
            git push
          fi

      - name: サイトを生成
        run: npm run build

      - name: note 用原稿（有料部分を含む）を保存
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: note-drafts
          path: out/note/
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
