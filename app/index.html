<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フィジカルAIノート</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1f2328; --muted: #6a6f76;
    --border: #e2e2de; --accent: #2f6fdb; --accent-weak: #e8f0fd; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181b; --panel: #1e2125; --text: #e6e6e3; --muted: #9aa0a6;
      --border: #30343a; --accent: #6ea0ff; --accent-weak: #22324d; --danger: #ff7b6b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181b; --panel: #1e2125; --text: #e6e6e3; --muted: #9aa0a6;
    --border: #30343a; --accent: #6ea0ff; --accent-weak: #22324d; --danger: #ff7b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.7 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0 auto 0 0; }
  button, .btn {
    font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  button:hover, .btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: var(--danger); }
  .layout { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .filters { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  input, textarea {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; width: 100%;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    font-size: 12px; padding: 1px 8px; border-radius: 99px; cursor: pointer;
    background: var(--accent-weak); color: var(--accent); border: 1px solid transparent;
  }
  .tag.active { border-color: var(--accent); font-weight: 600; }
  ul.notes { list-style: none; margin: 0; padding: 0 8px 16px; overflow-y: auto; flex: 1; }
  ul.notes li { padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  ul.notes li:hover { background: var(--accent-weak); }
  ul.notes li.selected { background: var(--accent-weak); outline: 1px solid var(--accent); }
  ul.notes .t { font-weight: 600; font-size: 14px; }
  ul.notes .m { font-size: 12px; color: var(--muted); }
  main { overflow-y: auto; padding: 16px 24px 48px; min-width: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .editor { display: flex; flex-direction: column; gap: 8px; }
  .editor .title { font-size: 20px; font-weight: 600; }
  .editor textarea { min-height: 55vh; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .empty { color: var(--muted); margin-top: 20vh; text-align: center; }
  .preview { max-width: 820px; }
  .preview h1, .preview h2, .preview h3 { line-height: 1.35; margin: 1.2em 0 .5em; }
  .preview h1 { font-size: 24px; } .preview h2 { font-size: 20px; } .preview h3 { font-size: 17px; }
  .preview a { color: var(--accent); }
  .preview table { border-collapse: collapse; display: block; overflow-x: auto; }
  .preview th, .preview td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
  .preview blockquote { margin: 0; padding: 4px 14px; border-left: 3px solid var(--accent); color: var(--muted); }
  .preview code { background: var(--accent-weak); padding: 0 4px; border-radius: 4px; }
  .preview hr { border: 0; border-top: 1px solid var(--border); }
  .meta { color: var(--muted); font-size: 12px; }
  .back { display: none; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; height: auto; }
    aside { border-right: 0; }
    .layout.detail aside { display: none; }
    .layout:not(.detail) main { display: none; }
    main { padding: 16px; }
    .back { display: inline-block; }
  }
</style>
</head>
<body>
<header>
  <h1>フィジカルAIノート</h1>
  <button class="primary" id="newBtn">＋ 新規ノート</button>
  <button id="seedBtn" title="同梱のフィジカルAIレポートを見出しごとにノートとして取り込みます">レポートを取り込む</button>
  <button id="dailyBtn" title="サイトで公開中の日次ノートをまとめて取り込みます">日次ノートを取り込む</button>
  <label class="btn">Markdownを取り込む<input type="file" id="fileIn" accept=".md,.markdown,.txt" hidden></label>
  <button id="exportMd">Markdownで書き出し</button>
  <button id="exportJson">JSONで書き出し</button>
  <label class="btn">JSONを読み込む<input type="file" id="jsonIn" accept=".json" hidden></label>
  <button id="themeBtn" title="テーマ切り替え">◐</button>
</header>
<div class="layout" id="layout">
  <aside>
    <div class="filters">
      <input id="search" type="search" placeholder="キーワードで検索">
      <div class="tags" id="tagList"></div>
    </div>
    <ul class="notes" id="noteList"></ul>
  </aside>
  <main id="main"></main>
</div>

<script src="markdown.js"></script>
<script src="seed.js"></script>
<script>
(() => {
  const KEY = "physical-ai-notes-v1";
  let notes = [];
  let selectedId = null;
  let editing = false;
  let activeTag = null;
  let memoryOnly = false;

  // ---------- 保存 ----------
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      notes = raw ? JSON.parse(raw) : null;
    } catch (e) { notes = null; memoryOnly = true; }
    if (!Array.isArray(notes)) {
      notes = [];
      if (window.SEED_REPORT) importMarkdown(window.SEED_REPORT, "レポート");
    }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(notes)); }
    catch (e) { memoryOnly = true; }
  }

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const now = () => new Date().toISOString();

  // ---------- Markdown 取り込み（## 見出しごとに 1 ノート） ----------
  function importMarkdown(md, baseTag) {
    const lines = md.replace(/\r\n/g, "\n").split("\n");
    const docTitle = (lines.find(l => /^# /.test(l)) || "# 取り込み").slice(2).trim();
    const sections = [];
    let cur = null;
    for (const line of lines) {
      if (/^## /.test(line)) {
        cur = { title: line.slice(3).trim(), body: [] };
        sections.push(cur);
      } else if (cur) {
        cur.body.push(line);
      }
    }
    if (!sections.length) sections.push({ title: docTitle, body: lines });
    const created = sections.map(s => ({
      id: uid(),
      title: s.title.replace(/^\d+\.\s*/, ""),
      body: s.body.join("\n").replace(/\n-{3,}\s*$/, "").trim(),
      tags: [baseTag, docTitle].filter(Boolean),
      created: now(), updated: now(),
    }));
    notes = created.concat(notes);
    save();
    return created;
  }

  const esc = globalThis.escapeHtml;
  const render = globalThis.renderMarkdown;

  // ---------- 画面描画 ----------
  const $ = id => document.getElementById(id);

  function filtered() {
    const q = $("search").value.trim().toLowerCase();
    return notes.filter(n =>
      (!activeTag || n.tags.includes(activeTag)) &&
      (!q || (n.title + "\n" + n.body + "\n" + n.tags.join(" ")).toLowerCase().includes(q))
    );
  }

  function renderSidebar() {
    const allTags = [...new Set(notes.flatMap(n => n.tags))].sort();
    $("tagList").innerHTML = allTags.map(t =>
      `<span class="tag ${t === activeTag ? "active" : ""}" data-tag="${esc(t)}">#${esc(t)}</span>`
    ).join("");
    const list = filtered();
    $("noteList").innerHTML = list.length ? list.map(n => `
      <li data-id="${n.id}" class="${n.id === selectedId ? "selected" : ""}">
        <div class="t">${esc(n.title || "（無題）")}</div>
        <div class="m">${new Date(n.updated).toLocaleString("ja-JP")}</div>
      </li>`).join("") : `<li class="m">ノートがありません</li>`;
  }

  function renderMain() {
    const n = notes.find(x => x.id === selectedId);
    $("layout").classList.toggle("detail", !!n);
    if (!n) {
      $("main").innerHTML = `<div class="empty">左の一覧からノートを選ぶか、「＋ 新規ノート」で作成してください。${
        memoryOnly ? "<br>※ このブラウザでは保存が使えないため、閉じると内容は消えます。JSONで書き出してください。" : ""}</div>`;
      return;
    }
    const back = `<button class="back" id="backBtn">← 一覧</button>`;
    if (editing) {
      $("main").innerHTML = `
        <div class="toolbar">${back}
          <button class="primary" id="doneBtn">完了</button>
          <button class="danger" id="delBtn">削除</button>
        </div>
        <div class="editor">
          <input class="title" id="title" placeholder="タイトル" value="${esc(n.title)}">
          <input id="tags" placeholder="タグ（カンマ区切り）" value="${esc(n.tags.join(", "))}">
          <textarea id="body" placeholder="本文（Markdown が使えます）">${esc(n.body)}</textarea>
        </div>`;
      $("title").oninput = e => update(n, { title: e.target.value });
      $("tags").oninput = e => update(n, { tags: e.target.value.split(/[,、]/).map(s => s.trim()).filter(Boolean) });
      $("body").oninput = e => update(n, { body: e.target.value });
      $("doneBtn").onclick = () => { editing = false; renderAll(); };
    } else {
      $("main").innerHTML = `
        <div class="toolbar">${back}
          <button class="primary" id="editBtn">編集</button>
          <button class="danger" id="delBtn">削除</button>
        </div>
        <article class="preview">
          <h1>${esc(n.title || "（無題）")}</h1>
          <div class="tags">${n.tags.map(t => `<span class="tag" data-tag="${esc(t)}">#${esc(t)}</span>`).join("")}</div>
          <div class="meta">更新: ${new Date(n.updated).toLocaleString("ja-JP")}</div>
          ${render(n.body)}
        </article>`;
      $("editBtn").onclick = () => { editing = true; renderMain(); };
    }
    $("delBtn").onclick = () => {
      if (!confirm(`「${n.title || "無題"}」を削除しますか？`)) return;
      notes = notes.filter(x => x.id !== n.id);
      selectedId = null; editing = false; save(); renderAll();
    };
    $("backBtn").onclick = () => { selectedId = null; editing = false; renderAll(); };
  }

  let saveTimer;
  function update(n, patch) {
    Object.assign(n, patch, { updated: now() });
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { save(); renderSidebar(); }, 300);
  }

  function renderAll() { renderSidebar(); renderMain(); }

  // ---------- 書き出し ----------
  function download(name, text, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function toMarkdown(list) {
    return "# フィジカルAIノート\n\n" + list.map(n =>
      `## ${n.title}\n\nタグ: ${n.tags.map(t => "#" + t).join(" ")}\n\n${n.body}\n`
    ).join("\n---\n\n");
  }

  // ---------- イベント ----------
  $("newBtn").onclick = () => {
    const n = { id: uid(), title: "", body: "", tags: activeTag ? [activeTag] : [], created: now(), updated: now() };
    notes.unshift(n); selectedId = n.id; editing = true; save(); renderAll();
    $("title").focus();
  };
  $("seedBtn").onclick = () => {
    if (!window.SEED_REPORT) return alert("seed.js が見つかりません。");
    const c = importMarkdown(window.SEED_REPORT, "レポート");
    selectedId = c[0].id; editing = false; renderAll();
  };
  $("dailyBtn").onclick = async () => {
    let list;
    try {
      const res = await fetch("daily.json", { cache: "no-store" });
      if (!res.ok) throw new Error();
      list = await res.json();
    } catch {
      return alert("日次ノートを読み込めませんでした。公開サイト上のアプリ（/app/）から開いてください。");
    }
    const ids = new Set(notes.map(n => n.id));
    const added = list.filter(d => !ids.has("daily-" + d.date)).map(d => ({
      id: "daily-" + d.date,
      title: `${d.date} ${d.title}`,
      body: d.body + (d.url ? `\n\n[記事ページを開く](${d.url})` : ""),
      tags: ["日次ニュース", ...(d.tags || [])],
      created: now(), updated: now(),
    }));
    notes = added.concat(notes);
    save();
    alert(`${added.length} 件の日次ノートを取り込みました。`);
    if (added[0]) { selectedId = added[0].id; editing = false; }
    renderAll();
  };
  $("fileIn").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const base = f.name.replace(/\.[^.]+$/, "");
    const c = importMarkdown(await f.text(), base);
    selectedId = c[0].id; editing = false; e.target.value = ""; renderAll();
  };
  $("exportMd").onclick = () => download("physical-ai-notes.md", toMarkdown(filtered()), "text/markdown");
  $("exportJson").onclick = () => download("physical-ai-notes.json", JSON.stringify(notes, null, 2), "application/json");
  $("jsonIn").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data)) throw new Error();
      const ids = new Set(notes.map(n => n.id));
      notes = data.filter(n => n && n.id && !ids.has(n.id))
        .map(n => ({ title: "", body: "", tags: [], created: now(), updated: now(), ...n }))
        .concat(notes);
      save(); renderAll();
    } catch { alert("JSON の形式が正しくありません。"); }
    e.target.value = "";
  };
  $("search").oninput = renderSidebar;
  document.addEventListener("click", e => {
    const tag = e.target.closest("[data-tag]");
    if (tag) { activeTag = activeTag === tag.dataset.tag ? null : tag.dataset.tag; renderSidebar(); return; }
    const li = e.target.closest("#noteList li[data-id]");
    if (li) { selectedId = li.dataset.id; editing = false; renderAll(); }
  });
  $("themeBtn").onclick = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem(KEY + "-theme", root.dataset.theme); } catch {}
  };
  try { const t = localStorage.getItem(KEY + "-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}

  load();
  renderAll();
})();
</script>
</body>
</html>
